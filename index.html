<!DOCTYPE html>
<html>

<head>
    <title>Barbearia da Rapaziada</title>

    <style>
        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 12px 25px;

            background-color: white;
            color: black;

            font-size: 18px;
            font-weight: bold;

            transition: 0.3s;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }    

        button:hover {
            background-color: #333;
            color: white;
            transform: scale(1.05);
        }
        #botaoAgendar {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        #botaoAgendar:hover {
            transform: scale(1.05);
        }

        #resultadoAgendamento {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid white;
            font-size: 18px;
            font-weight: bold;
            color: lightgreen;
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.4);
        }

        .logo img {
            margin-bottom: 20px;
        }

        .logo img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 15px white;
            transition: 0.3s;
            display: block;
            margin: 0 auto;
        }

        .logo img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .logo img {
                width: 140px;
                height: 140px;
            }

        h1 {
            font-size: 28px;
            text-shadow: 0 0 10px black;
        }

        .servico {
            width: 90%;
            box-sizing: border-box;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        input,
        select {
            width: 90%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            box-shadow: 0 0 8px white;
        }
    }

    body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('fundo-barbearia.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;   
        }

        .agendamento {
            background-color: rgba(0, 0, 0, 0.70);
            padding: 25px;
            margin: 30px auto;
            max-width: 500px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .servico {
            border: 1px solid white;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            width: 300px;
            text-align: center;
            font-size: 18px;
            box-shadow: 0 0 10px white;
            transition: 0.3s;

        }
        .servico:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
     input[type="date"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid white;
            font-size: 16px;
            margin: 5px;
            background-color: #222;
            color: white;
            width: 250px;
        }
        h2 {
            margin-top: 30px;
            font-size: 28px;
            color: white;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="logo">
        <img src="logo.png" alt="logo da barbearia">
    </div>

    <h1>Olá, bem-vindo à Barbearia da Rapaziada!</h1>

    <h2>Nossos serviços</h2>

    <p class="servico">✂️ Corte de cabelo - R$ 25,00</p>
    <p class="servico">🧔 Barba - R$ 20,00</p>
    <p class="servico">✨ Sobrancelha - R$ 5,00</p>
    <p class="servico">💈 Pacote completo (Corte + Barba + Sobrancelha) - R$ 50,00</p>

    <h2>Agende seu horário</h2>

<div class="agendamento">

    <label for="nomeCliente">Seu nome:</label>
    <input type="text" id="nomeCliente" placeholder="Digite seu nome">

    <br><br>

    <label for="servico">Escolha o serviço:</label>

    <select id="servico">
        <option value="Corte de cabelo">Corte de cabelo</option>
        <option value="Barba">Barba</option>
        <option value="Sobrancelha">Sobrancelha</option>
        <option value="Pacote completo">Pacote completo</option>
    </select>

    <br><br>

    <label for="data">Escolha a data:</label>
    <input type="date" id="data">

    <br><br>

    <label for="horario">Escolha o horario:</label>

    <input type="time" id="horario">

    <button id="botaoAgendar" onclick="agendar()">Agendar horário</button>

    <p id="resultadoAgendamento"></p>
</div>

    <script>

        function mostrarMensagem() {
            let nome = document.getElementById("nome").value;

            document.getElementById("mensagem").textContent =
                "Olá, " + nome + "!";
        }


        let cliques = 0;

        function contarCliques() {
            cliques++;

            document.getElementById("contador").textContent =
                cliques;
        }


        function agendar() {
            let nome = document.getElementById("nomeCliente").value;

            if (nome==="") {
                alert("Digite seu nome antes de agendar!");
                return;
            }

            let servico = document.getElementById("servico").value;

            if (servico==="") {
                alert("Escolha um servico antes de agendar!");
                return;
            }

            let data = document.getElementById("data").value;

            if (data==="") {
                alert("Escolha uma data antes de agendar!");
                return;
            }

            let horario = document.getElementById("horario").value;

            if (horario==="") {
                alert("Escolha em horario antes de agendar!");
                return;s
            }

            let hoje = new Date().toISOString().split("T")[0];

            if (data < hoje) {
                alert("Escoha uma data valida!");
                return; 
            }
            
            let preco = "";

            if (servico === "Corte de cabelo") {
                preco = "R$ 25,00";
            } else if (servico === "Barba") {
                preco = "R$ 20,00";
            } else if (servico === "Sobrancelha") {
                preco = "R$ 5,00";
            } else if (servico === "Pacote completo") {
                preco = "R$ 50,00";
            }

        
        let agendamentos =
        JSON.parse(localStorage.getItem("agendamentos") || "[]"
        );

        agendamentos.push({
            nome: nome,
            servico: servico,
            data: data,
            horario: horario,
        });

        localStorage.setItem(
            "agendamentos", 
            JSON.stringify(agendamentos)
        );

        // MENSAGEM PARA O WHATSAPP
        let mensagemWhatsapp =Agendamento =
            "💈 *Novo Agendamento - Barbearia da Rapaziada*%0A%0A" +
        "👨🏻‍💼 Cliente: " + nome + "%0A" +
        "💇‍♂️ Serviço: " + servico + "%0A" +
        "📅 Data: " + data + "%0A" +
        "⏰ Horário: " + horario + "%0A" +
        "💰 Preço: " + preco;

        // NUMERO DO WHATSAPP DO BARBEIRO
        let numeroWhatsapp = "5561991777405";

        //CRIAR LINK DO WHATSAPP
        let linkWhatsapp =
            "https://wa.me/" +
            numeroWhatsapp +
            "?text=" +
            mensagemWhatsapp;

            //ABRIR WHATSAPP
    window.open(linkWhatsapp, "_blank");

        //MOSTRAR CONFIRMACAO NO SITE
        document.getElementById("resultadoAgendamento").innerText =
            "✅ Agendamento realizado!\n"
            + nome + " - " + servico + " - " + data + " - " + preco + " as " + horario;

            document.getElementById("nomeCliente").value = "";
            document.getElementById("data").value = "";
            document.getElementById("servico").selectedIndex = 0;
            document.getElementById("horario").value = "";
        }

    </script>

</body>

</html>
